<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Api Dummy</title>
</head>

<body>
    <main>
        <div id="titulo">
            <div id="foto">
                <a href="index.html"><img src="UwU.jpeg" height="100px" width="180px"></a>
            </div>
            <h1 id="h1titulo">API de Productos</h1>
            <div id="link">
                <a href="index.html">
                    <h2>Productos</h2>
                </a>
                <a href="administrarProductos.html">
                    <h2>Administrar Productos</h2>
                </a>
            </div>
        </div>
        <h2 class="mb-3 text-center">Administrar Productos</h2>
        <div id="buscador-container">
            <input type="text" id="input-busqueda" placeholder="Buscar producto por nombre...">
            <a href="addProducto.html" class="btn btn-dark">Nuevo Producto</a>
        </div>
        <div class="d-flex justify-content-center mb-3">
            <select id="categoria" class="form-select w-25">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <div class="container my-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered align-middle text-center"
                    id="tabla-productos">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center my-3">
                <span id="info-pagina">Página 1 de 1</span>
                <div>
                    <button id="btn-anterior" class="btn btn-dark btn-sm me-2">← Anterior</button>
                    <button id="btn-siguiente" class="btn btn-dark btn-sm">Siguiente →</button>
                </div>
            </div>
        </div>
    </main>
    <script src="filtroCategoria.js"></script>
    <script src="cargarCategorias.js"></script>
    <script src="CargarAdminProductos.js"></script>
    <script src="BusquedaAdmin.js"></script>
    <script src="eliminarProduct.js"></script>
    <footer class="footer">
        <p>© 2026 A.Sanjay M.C.. Todos los derechos reservados.</p>
    </footer>
</body>


</html>
