<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Api Dummy</title>
</head>

<body>
    <main>
        <div id="titulo">
            <div id="foto">
                <a href="index.html"><img src="UwU.jpeg" height="100px" width="180px"></a>
            </div>
            <h1 id="h1titulo">API de Productos</h1>
            <div id="link">
                <a href="index.html">
                    <h2>Productos</h2>
                </a>
                <a href="administrarProductos.html">
                    <h2>Administrar Productos</h2>
                </a>
            </div>
        </div>
        <div id="FEditar" class="container mt-4">
            <h3 class="mb-3">Editar producto</h3>

            <form id="form-editar">
                <div class="mb-2">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="title" class="form-control">
                </div>

                <div class="mb-2">
                    <label class="form-label">Precio</label>
                    <input type="number" id="price" class="form-control" step="0.01" min="0">
                </div>

                <button type="submit" class="btn btn-dark">
                    Guardar cambios
                </button>
                <a href="administrarProductos.html" class="btn btn-dark">
                    Cancelar
                </a>
            </form>
        </div>

    </main>
    <script src="editarProductJS.js"></script>
    <footer class="footer">
        <p>© 2026 A.Sanjay M.C.. Todos los derechos reservados.</p>
    </footer>
</body>


</html>
