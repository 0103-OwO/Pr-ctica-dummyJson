<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Api Dummy</title>
</head>

<body>
    <main>
        <div id="titulo">
            <div id="foto">
                <a href="index.html"><img src="UwU.jpeg" height="100px" width="180px"></a>
            </div>
            <h1 id="h1titulo">API de Productos</h1>
            <div id="link">
                <a href="index.html">
                    <h2>Productos</h2>
                </a>
                <a href="administrarProductos.html">
                    <h2>Administrar Productos</h2>
                </a>
            </div>
        </div>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">

                    <form class="form-dark">
                        <h3 class="text-center mb-4">Alta de un producto</h3>

                        <div class="mb-3">
                            <label class="form-label">Nombre del producto</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ingresa tu nombre">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" id="precio" class="form-control" placeholder="0.00">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select id="categoria" class="form-select">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <script src="cargarCategorias.js"></script>
                        <div class="mb-3">
                            <label class="form-label">Descripcion</label>
                            <textarea class="form-control" id="descripcion" rows="4"
                                placeholder="Escribe la Descripcion"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" onclick="crearProducto(event)">
                            Guardar producto
                        </button>
                    </form>
                    <div id="mensaje-exito" style="display:none; color:#000000; margin-top:15px;">
                        Producto guardado con éxito!
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="add.js"></script>
    <footer class="footer">
        <p>© 2026 A.Sanjay M.C.. Todos los derechos reservados.</p>
    </footer>
</body>


</html>
